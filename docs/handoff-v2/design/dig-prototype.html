<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root[data-theme="light"]{--bg:#F4F6FA;--panel:#FFFFFF;--panel-2:#EDF1F7;--line:#E1E7EF;--line-2:#C8D2DF;--ink:#0E1421;--ink-2:#4A5568;--ink-3:#8593A6;
 --blue:#2457F5;--blue-2:#1A45D6;--blue-soft:#E6EDFF;--teal:#0BA39E;--teal-soft:#DCF5F2;--green:#1E9E5A;--green-soft:#DDF4E7;--amber:#D9890B;--amber-soft:#FBF0D6;--coral:#E4573F;--coral-soft:#FCE6E1;--rose:#D14A7A;--rose-soft:#FBE3EC;--red:#D64545;
 --hi:rgba(255,255,255,.7);--shadow:0 1px 1px rgba(14,20,33,.03),0 4px 14px rgba(14,20,33,.05);--shadow-2:0 2px 4px rgba(14,20,33,.05),0 14px 34px rgba(14,20,33,.10);--shadow-lg:0 30px 90px rgba(14,20,33,.22);--glow:0 0 0 3px rgba(36,87,245,.16)}
:root[data-theme="dark"]{--bg:#0B0F16;--panel:#121823;--panel-2:#1A2231;--line:#202A3A;--line-2:#2E3B50;--ink:#E9EEF6;--ink-2:#9BA7BA;--ink-3:#5E6C82;
 --blue:#5B9AFF;--blue-2:#7DB0FF;--blue-soft:#15274E;--teal:#2FD6C9;--teal-soft:#0E302E;--green:#4ADE80;--green-soft:#12301E;--amber:#F2B43E;--amber-soft:#3B2D10;--coral:#FF7A62;--coral-soft:#3D1F18;--rose:#F472A6;--rose-soft:#3A1A29;--red:#F07171;
 --hi:rgba(255,255,255,.04);--shadow:0 1px 1px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.35);--shadow-2:0 2px 4px rgba(0,0,0,.4),0 14px 34px rgba(0,0,0,.5);--shadow-lg:0 30px 90px rgba(0,0,0,.75);--glow:0 0 0 3px rgba(91,154,255,.22)}
:root{--sans:'Geist',system-ui,sans-serif;--mono:'Geist Mono',ui-monospace,monospace;--t:180ms cubic-bezier(.2,.7,.2,1);--spring:320ms cubic-bezier(.34,1.56,.64,1)}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:16px 12px;display:flex;justify-content:center;align-items:flex-start;transition:background .3s ease,color .3s ease}
a{color:inherit;text-decoration:none}button{font-family:inherit;cursor:pointer;color:inherit}input,select,textarea{font-family:inherit}
kbd{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:4px;padding:1px 5px;background:var(--panel);line-height:1.3}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}

.proto{width:100%;max-width:1280px}
.proto-bar{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12px;color:var(--ink-3)}
.proto-bar b{color:var(--ink-2);font-weight:600}.proto-bar .sp{flex:1}
.proto-bar button{border:1px solid var(--line-2);background:var(--panel);border-radius:7px;padding:5px 10px;font-size:12px;color:var(--ink-2)}
.proto-bar button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.app{width:100%;height:840px;background:var(--bg);border:1px solid var(--line-2);border-radius:16px;box-shadow:var(--shadow-lg);overflow:hidden;position:relative;display:grid;grid-template-columns:232px 1fr;transition:background .3s ease}
.app.grid-mode{height:auto;display:block;background:transparent;border:none;box-shadow:none;overflow:visible}

/* ===== Sidebar ===== */
.side{background:var(--panel);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:2px;overflow-y:auto;transition:background .3s ease}
.who{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.who .av{width:32px;height:32px;border-radius:10px;background:conic-gradient(from 210deg,var(--blue),var(--teal),var(--green),var(--blue));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 12px rgba(36,87,245,.25);position:relative}
.who .av::after{content:"";position:absolute;inset:3px;border-radius:7px;background:var(--panel);opacity:.0}
.who .n{font-weight:600;font-size:14px;letter-spacing:-.01em}.who .s{font-size:11.5px;color:var(--ink-3)}
.add-btn{display:flex;align-items:center;gap:8px;margin:0 0 12px;padding:10px 12px;border-radius:10px;background:var(--blue);color:#fff;font-weight:600;font-size:13.5px;border:none;width:100%;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 6px 16px rgba(36,87,245,.28);transition:transform var(--t),background var(--t),box-shadow var(--t)}
.add-btn:hover{background:var(--blue-2);transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 22px rgba(36,87,245,.32)}
.add-btn:active{transform:scale(.98)}
.add-btn kbd{margin-left:auto;color:#fff;border-color:rgba(255,255,255,.35);background:transparent}
.nav{position:relative}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;color:var(--ink-2);font-weight:500;transition:background var(--t),color var(--t),transform var(--t);cursor:pointer;position:relative}
.nav a:hover{background:var(--panel-2);color:var(--ink)}.nav a:active{transform:scale(.99)}
.nav a.on{background:var(--blue-soft);color:var(--blue)}
.nav a.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--blue);animation:grow .25s var(--spring)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.nav a svg{width:16px;height:16px;flex-shrink:0;transition:transform var(--t)}.nav a:hover svg{transform:translateY(-1px)}
.nav a .k{margin-left:auto}.nav a.on .k{color:var(--blue);border-color:transparent;background:transparent}
.nav a .cnt{margin-left:auto;font-size:10.5px;font-weight:600;color:#fff;background:var(--coral);border-radius:999px;padding:1px 7px;animation:pop .3s var(--spring)}
.sec-h{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:18px 10px 6px;display:flex;justify-content:space-between}
.sec-h a{color:var(--ink-3);font-weight:500;text-transform:none;letter-spacing:0;cursor:pointer}.sec-h a:hover{color:var(--blue)}
.groups a{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;color:var(--ink-2);font-size:13px;cursor:pointer;transition:background var(--t)}
.groups a:hover,.groups a.on{background:var(--panel-2);color:var(--ink)}
.groups i{width:10px;height:10px;border-radius:3px;flex-shrink:0;box-shadow:0 0 0 2px color-mix(in srgb,currentColor 0%,transparent);transition:transform var(--t)}
.groups a:hover i{transform:scale(1.25)}
.groups .c{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}.groups .lk{font-size:10px;color:var(--ink-3)}
.side-foot{margin-top:auto;padding:10px 6px 0;display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ink-3)}
.side-foot a{cursor:pointer}.side-foot a:hover{color:var(--blue)}
.theme{display:flex;background:var(--panel-2);border-radius:7px;padding:2px;position:relative}
.theme button{border:none;background:transparent;color:var(--ink-3);font-size:11px;padding:3px 7px;border-radius:5px;transition:all var(--t)}
.theme button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}

/* ===== Main ===== */
.main{overflow-y:auto;position:relative;scroll-behavior:smooth}
.view{padding:28px 36px 80px;max-width:980px;animation:fade .28s var(--t)}
.view.wide{max-width:none}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hd{display:flex;align-items:flex-end;gap:14px;margin-bottom:22px}
.hd h1{font-size:24px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.hd .sub{color:var(--ink-2);font-size:13.5px;margin-top:4px}.hd .sub b{color:var(--ink);font-weight:600}
.hd .r{margin-left:auto;display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 12px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;box-shadow:inset 0 1px 0 var(--hi),0 1px 1px rgba(14,20,33,.04);transition:border-color var(--t),transform var(--t),background var(--t),box-shadow var(--t);white-space:nowrap}
.btn:hover{border-color:var(--ink-3);transform:translateY(-1px);box-shadow:inset 0 1px 0 var(--hi),0 4px 10px rgba(14,20,33,.08)}
.btn:active{transform:scale(.97)}
.btn.p{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 4px 12px rgba(36,87,245,.25)}.btn.p:hover{background:var(--blue-2)}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}.btn.danger{color:var(--red)}.btn.ghost{border-color:transparent;box-shadow:none;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--panel-2);box-shadow:none}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--panel);border-radius:9px;padding:7px 11px;color:var(--ink-3);font-size:13px;width:220px;cursor:text;box-shadow:inset 0 1px 0 var(--hi);transition:border-color var(--t)}
.search:hover{border-color:var(--ink-3)}.search kbd{margin-left:auto}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:inset 0 1px 0 var(--hi),var(--shadow);overflow:hidden}
.sec{margin-bottom:26px}
.sec-t{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sec-t h2{font-size:15px;font-weight:600;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.sec-t .ic{width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center}
.sec-t .ic svg{width:13px;height:13px}
.sec-t .help{font-size:12.5px;color:var(--ink-3);font-weight:400}
.sec-t .rt{margin-left:auto;font-size:12.5px;color:var(--blue);cursor:pointer}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:13.5px;animation:rowin .3s var(--t) both;transition:background var(--t),opacity var(--t),transform var(--t)}
.row:nth-child(1){animation-delay:.02s}.row:nth-child(2){animation-delay:.05s}.row:nth-child(3){animation-delay:.08s}.row:nth-child(4){animation-delay:.11s}.row:nth-child(5){animation-delay:.14s}
@keyframes rowin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.row:last-child{border-bottom:none}.row.click{cursor:pointer}.row.click:hover{background:var(--panel-2)}
.row.leave{opacity:0;transform:translateX(24px);height:0;padding:0;overflow:hidden}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:500}.row .m{font-size:12px;color:var(--ink-3);margin-top:1px}.row .m b{color:var(--ink-2);font-weight:500}
.row .acts{display:flex;gap:6px;opacity:.8;transition:opacity var(--t)}.row:hover .acts{opacity:1}
.dotc{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.badge.w{background:var(--amber-soft);color:var(--amber)}.badge.s{background:var(--green-soft);color:var(--green)}.badge.g{background:var(--panel-2);color:var(--ink-2)}.badge.b{background:var(--coral-soft);color:var(--coral)}.badge.i{background:var(--teal-soft);color:var(--teal)}.badge.pk{background:var(--panel-2);color:var(--ink-3)}
.badge.t-app{background:var(--blue-soft);color:var(--blue)}.badge.t-hw{background:var(--amber-soft);color:var(--amber)}.badge.t-eng{background:var(--rose-soft);color:var(--rose)}.badge.t-task{background:var(--panel-2);color:var(--ink-2)}.badge.t-x{background:var(--teal-soft);color:var(--teal)}
.empty{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:13px}
.empty b{display:block;color:var(--ink-2);font-weight:600;margin-bottom:3px}
.empty .gl{width:36px;height:36px;border-radius:10px;margin:0 auto 10px;display:flex;align-items:center;justify-content:center}
.empty .gl svg{width:18px;height:18px}
.hint-line{font-size:12.5px;color:var(--ink-3);margin-top:8px}

/* Stage bar */
.sbar{display:flex;gap:3px;align-items:center}
.sbar i{flex:1;height:6px;border-radius:3px;background:var(--panel-2);transform-origin:left;animation:barin .5s var(--t) both}
.sbar i:nth-child(2){animation-delay:.04s}.sbar i:nth-child(3){animation-delay:.08s}.sbar i:nth-child(4){animation-delay:.12s}.sbar i:nth-child(5){animation-delay:.16s}.sbar i:nth-child(6){animation-delay:.2s}.sbar i:nth-child(7){animation-delay:.24s}
@keyframes barin{from{transform:scaleX(.2);opacity:.4}to{transform:scaleX(1);opacity:1}}
.sbar i.d{background:var(--gc);opacity:.45}.sbar i.c{background:var(--gc);box-shadow:0 0 0 2px color-mix(in srgb,var(--gc) 22%,transparent)}
.stage-line{font-size:12px;color:var(--ink-2);margin-top:7px;display:flex;justify-content:space-between;gap:8px}.stage-line b{color:var(--ink);font-weight:600}

/* Project cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.pc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:inset 0 1px 0 var(--hi),var(--shadow);cursor:pointer;transition:transform var(--t),box-shadow var(--t),border-color var(--t);display:flex;flex-direction:column;gap:10px;position:relative;animation:rowin .3s var(--t) both}
.pc::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--gc);opacity:0;transition:opacity var(--t)}
.pc:hover{border-color:var(--line-2);transform:translateY(-2px);box-shadow:inset 0 1px 0 var(--hi),var(--shadow-2)}.pc:hover::before{opacity:1}
.pc .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.pc .t{font-weight:600;font-size:15px;letter-spacing:-.012em;line-height:1.2}
.pc .nx{font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:9px}
.pc .nx span{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:1px}.pc .nx span.w{color:var(--amber)}
.pc .qa{display:flex;gap:6px;opacity:0;max-height:0;overflow:hidden;transition:all var(--t);transform:translateY(4px)}
.pc:hover .qa{opacity:1;max-height:40px;transform:none}
.pc.quiet{opacity:.65}.pc.parked{opacity:.55;border-style:dashed}
.grp{margin-bottom:22px}
.grp-h{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.grp-h .n{font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
.grp-h .c{font-size:12px;color:var(--ink-3)}.grp-h .lk{font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:999px;padding:1px 7px}
.grp-h .add{margin-left:auto;font-size:12.5px;color:var(--ink-3);cursor:pointer}.grp-h .add:hover{color:var(--blue)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
.chip{font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:6px;background:var(--panel);transition:all var(--t);user-select:none}
.chip:hover{border-color:var(--ink-3);transform:translateY(-1px)}.chip:active{transform:scale(.97)}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip i{width:8px;height:8px;border-radius:2px}
.chips .sp{flex:1}.chips select{font-size:12.5px;color:var(--ink-2);background:var(--panel);border:1px solid var(--line-2);border-radius:999px;padding:5px 10px}

/* ===== Roadmap ===== */
.rm-sum{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
.rm-k{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:inset 0 1px 0 var(--hi),var(--shadow);display:flex;align-items:center;gap:12px;transition:transform var(--t)}
.rm-k:hover{transform:translateY(-1px)}
.rm-k .n{font-size:24px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rm-k .l{font-size:12px;color:var(--ink-3)}.rm-k .l b{display:block;color:var(--ink-2);font-weight:600;font-size:13px}
.rm-k .sw{width:6px;height:36px;border-radius:3px}
.horizons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;align-items:start}
.hz{background:var(--panel-2);border-radius:14px;padding:10px;min-height:200px}
.hz-h{display:flex;align-items:center;gap:8px;padding:4px 6px 10px}
.hz-h .n{font-weight:600;font-size:14px}.hz-h .c{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.hz-h .d{font-size:11.5px;color:var(--ink-3);margin-left:auto}
.hz-h i{width:8px;height:8px;border-radius:50%}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;box-shadow:inset 0 1px 0 var(--hi),var(--shadow);cursor:pointer;transition:transform var(--t),box-shadow var(--t);animation:rowin .3s var(--t) both;position:relative}
.rc:hover{transform:translateY(-2px);box-shadow:inset 0 1px 0 var(--hi),var(--shadow-2)}
.rc .t{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:8px}
.rc .m{font-size:12px;color:var(--ink-3);margin-top:3px}
.rc .mv{display:flex;gap:4px;margin-top:8px;opacity:0;transition:opacity var(--t)}.rc:hover .mv{opacity:1}
.rc .mv button{border:1px solid var(--line-2);background:var(--panel);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--ink-2)}
.rc .mv button:hover{border-color:var(--blue);color:var(--blue)}
.rc .sb2{margin-top:8px}.rc .sb2 .sbar i{height:4px}
.hz .empty{padding:16px 8px;font-size:12px}
.grp-lbl{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:6px 6px 4px;display:flex;align-items:center;gap:6px}
.grp-lbl i{width:8px;height:8px;border-radius:2px}

/* Project timeline (per-project roadmap) */
.tl{position:relative;padding-left:4px}
.tl-s{display:grid;grid-template-columns:28px 1fr;gap:14px;padding-bottom:18px;position:relative}
.tl-s::before{content:"";position:absolute;left:13px;top:28px;bottom:0;width:2px;background:var(--line)}
.tl-s:last-child::before{display:none}
.tl-s .nd{width:28px;height:28px;border-radius:50%;border:2px solid var(--line-2);background:var(--panel);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--ink-3);z-index:1;transition:transform var(--spring)}
.tl-s.done .nd{background:var(--gc);border-color:var(--gc);color:#fff}
.tl-s.cur .nd{border-color:var(--gc);color:var(--gc);font-weight:600;box-shadow:0 0 0 5px color-mix(in srgb,var(--gc) 16%,transparent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 5px color-mix(in srgb,var(--gc) 16%,transparent)}50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--gc) 8%,transparent)}}
.tl-s .h{display:flex;align-items:baseline;gap:10px;padding-top:4px}
.tl-s .h b{font-size:14.5px;font-weight:600}.tl-s .h span{font-size:12px;color:var(--ink-3)}
.tl-s.done .h b{color:var(--ink-2)}.tl-s.future .h b{color:var(--ink-3)}
.tl-s .bd{margin-top:6px;font-size:13px;color:var(--ink-2)}
.tl-s .bd .it{display:flex;gap:8px;align-items:center;padding:3px 0;color:var(--ink-2)}
.tl-s .bd .it.ok{color:var(--ink-3)}.tl-s .bd .it .ck{width:12px;height:12px;border-radius:4px;border:1.5px solid var(--line-2);flex-shrink:0}
.tl-s .bd .it.ok .ck{background:var(--gc);border-color:var(--gc)}
.tl-s .bd .rel{display:inline-flex;align-items:center;gap:6px;background:var(--green-soft);color:var(--green);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;margin:4px 6px 0 0}

/* Project page */
.crumb{font-size:12.5px;color:var(--ink-3);margin-bottom:12px}.crumb a{cursor:pointer}.crumb a:hover{color:var(--blue)}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:18px}

function renderProjectRoadmap(p){
  var t=T(p.type),g=G(p.group);
  var hist=function(s){return p.hist.find(function(h){return h.stage===s})};
  var rows=t.stages.map(function(s,i){var h=hist(s);var cls=i<p.stage?'done':(i===p.stage?'cur':'future');
    var body='';
    if(i<p.stage){body='<div class="bd">'+(h?fmt(h.from)+' → '+fmt(h.to)+' · '+Math.max(1,Math.round((h.to-h.from)/DAY))+' days':'')+p.releases.filter(function(r){return h&&r.at>=h.from&&r.at<=new Date(h.to.getTime()+DAY)}).map(function(r){return '<div><span class="rel">'+esc(r.v)+' · '+esc(r.note)+'</span></div>'}).join('')+'</div>'}
    else if(i===p.stage){var open=p.items.filter(function(x){return !x.done}),done=p.items.filter(function(x){return x.done});body='<div class="bd">since '+fmt(p.enteredAt)+' · '+days(p.enteredAt)+' days'+(p.next?'<div style="margin-top:6px"><b style="color:var(--ink)">Next:</b> '+esc(p.next)+'</div>':'')+'<div style="margin-top:6px">'+open.map(function(x){return '<div class="it"><span class="ck"></span>'+esc(x.text)+'</div>'}).join('')+done.map(function(x){return '<div class="it ok"><span class="ck"></span>'+esc(x.text)+'</div>'}).join('')+'</div></div>'}
    else{var ex=t.check[s]||[];body='<div class="bd" style="color:var(--ink-3)">'+(ex.length?'Will need: '+ex.map(esc).join(' · '):'Nothing preset. Add expectations in Settings.')+'</div>'}
    return '<div class="tl-s '+cls+'"><div class="nd">'+(i<p.stage?'✓':(i+1))+'</div><div><div class="h"><b>'+esc(s)+'</b><span>'+(i<p.stage?'done':(i===p.stage?'you are here':'later'))+'</span></div>'+body+'</div></div>'});
  return '<div class="two" style="--gc:'+g.color+'"><div><div class="sec-t" style="margin-top:4px"><h2>'+secIcon('rm')+'Where this project has been, and where it\'s going</h2></div><div class="box" style="padding:18px 18px 4px"><div class="tl">'+rows.join('')+'</div></div></div>'+
  '<aside class="rail"><div><div class="sec-t"><h2>On the roadmap</h2></div><div class="box" style="padding:12px 14px"><div style="font-size:12.5px;color:var(--ink-2);margin-bottom:8px">Which horizon this sits in on the '+esc(g.name)+' roadmap.</div><div style="display:flex;gap:6px;flex-wrap:wrap">'+HZ.map(function(h){return '<span class="chip '+((p.when||'later')===h[0]?'on':'')+'" onclick="setWhen(\''+p.id+'\',\''+h[0]+'\')">'+h[1]+'</span>'}).join('')+'</div></div></div>'+
  '<div><div class="sec-t"><h2>'+secIcon('rel')+'Releases</h2><a class="rt" onclick="addRelease(\''+p.id+'\')">+ add</a></div><div class="box">'+(p.releases.length?p.releases.slice().reverse().map(function(r){return '<div class="rel"><span class="v">'+esc(r.v)+'</span><span>'+esc(r.note)+'</span><span class="m">'+fmt(r.at)+'</span></div>'}).join(''):'<div class="empty" style="padding:14px">Nothing released yet.</div>')+'</div></div></aside></div>';
}
function renderProjectRecord(p){
  var g=G(p.group);var acts=S.activity.filter(function(a){return a.pid===p.id});

/* capture */
function openCap(type){S.capType=type||'auto';S.capProject='';render();document.getElementById('ov-cap').classList.add('open');var i=document.getElementById('cap-in');i.value='';capDetect();setTimeout(function(){i.focus()},10)}
function guessType(t){t=t.trim();if(/^https?:\/\//i.test(t)||/^[a-z0-9.-]+\.[a-z]{2,}(\/|$)/i.test(t))return 'link';if(/^!/.test(t)||/\b(bug|broken|crash|wrong|doesn't work|stale)\b/i.test(t))return 'bug';if(/^(fix|add|write|ship|call|send|update|check|make|finish)\b/i.test(t))return 'todo';return 'idea'}
function effType(){var raw=document.getElementById('cap-in').value;return S.capType==='auto'?guessType(raw):S.capType}
function capDetect(){var raw=document.getElementById('cap-in').value;var k=effType();document.querySelectorAll('#cap-types .ty').forEach(function(s){s.classList.toggle('on',s.dataset.t===S.capType)});var p=S.capProject?Pr(S.capProject):null;var as=document.getElementById('cap-as');var where=(k==='link'||k==='note')?'the Library':(k==='idea'&&!p?'Ideas':(p?p.name:'your inbox'));as.textContent=raw.trim()?('Saving as '+(S.capType==='auto'?'a '+k+' (guessed)':'a '+k)+' → '+where):''}
function doCapture(){var raw=document.getElementById('cap-in').value.trim();if(!raw)return;var k=effType();var text=raw.replace(/^!\s*/,'');var p=S.capProject?Pr(S.capProject):null;
  if(p&&(k==='todo'||k==='bug'||k==='idea')){p.items.unshift({id:uid(),text:text,done:false,tag:k==='bug'?'bug':''});p.lastAct=NOW;toast('Added to <b>'+esc(p.name)+'</b>\'s checklist')}
  else if(p&&k==='decision'){recordDecision(p.id,text,null)}
  else if(p&&(k==='note'||k==='link')){S.library.unshift({id:uid(),kind:k,title:text,meta:k==='link'?raw:'',group:p.group});toast('Saved to the Library under '+esc(G(p.group).name))}
  else if(k==='link'||k==='note'){S.library.unshift({id:uid(),kind:k,title:text,meta:k==='link'?raw:'',group:''});toast('Saved to the Library')}
  else if(k==='idea'){S.ideas.unshift({id:uid(),text:text,desc:'',at:NOW,opened:null,group:''});toast('Idea saved. It\'s in Ideas whenever you want it.')}
  else{S.inbox.unshift({id:uid(),text:text,type:k,at:NOW,guess:null});toast('Saved to your inbox. Put it somewhere when you\'re ready.')}
  closeOv();render()}
/* palette */

var palIdx=0;
function palItems(q){q=q.toLowerCase();var out=[];S.projects.forEach(function(p){if(!q||p.name.toLowerCase().indexOf(q)>=0)out.push({k:'project',t:p.name,m:stageName(p)+' · '+G(p.group).name,go:"openP('"+p.id+"')"})});S.ideas.forEach(function(x){if(!q||x.text.toLowerCase().indexOf(q)>=0)out.push({k:'idea',t:x.text,m:ago(x.at)+' ago',go:"openIdea('"+x.id+"')"})});S.library.forEach(function(x){if(!q||x.title.toLowerCase().indexOf(q)>=0)out.push({k:x.kind,t:x.title,m:x.group?G(x.group).name:'',go:"go('library')"})});S.projects.forEach(function(p){p.decisions.forEach(function(x){if(q&&x.text.toLowerCase().indexOf(q)>=0)out.push({k:'decision',t:dno(x.no)+' '+x.text,m:p.name,go:"openP('"+p.id+"')"})})});return out.slice(0,12)}
function palFilter(q){palIdx=0;var it=palItems(q);document.getElementById('pal-list').innerHTML=it.length?it.map(function(x,i){return '<div class="pal-it '+(i===0?'hl':'')+'" onclick="closeOv();'+x.go+'"><span class="k">'+x.k+'</span><span>'+esc(x.t)+'</span><span class="m">'+esc(x.m)+'</span></div>'}).join(''):'<div class="empty">Nothing matches.</div>'}
function palKey(e){var its=document.querySelectorAll('.pal-it');if(!its.length)return;if(e.key==='ArrowDown')palIdx=Math.min(its.length-1,palIdx+1);else if(e.key==='ArrowUp')palIdx=Math.max(0,palIdx-1);else if(e.key==='Enter'){its[palIdx].click();return}else return;its.forEach(function(x,i){x.classList.toggle('hl',i===palIdx)});e.preventDefault()}
/* inbox */
function openSort(id){var u=S.inbox.find(function(x){return x.id===id});if(!u)return;dlg('<div class="dh2"><h3>Where should this go?</h3><span class="x" onclick="closeOv()">✕</span></div><div class="body"><div style="font-size:15px;font-weight:500;margin-bottom:10px">'+esc(u.text)+'</div><label>It is</label><select id="s-kind"><option value="idea" '+(u.type==='idea'?'selected':'')+'>An idea for something new</option><option value="todo">A to-do on a project</option><option value="bug" '+(u.type==='bug'?'selected':'')+'>A bug on a project</option><option value="link" '+(u.type==='link'?'selected':'')+'>A link to keep</option><option value="note">A note to keep</option></select><div class="row2"><div><label>Project</label><select id="s-p"><option value="">None</option>'+S.projects.map(function(p){return '<option value="'+p.id+'" '+(u.guess===p.id?'selected':'')+'>'+esc(p.name)+'</option>'}).join('')+'</select></div><div><label>Group</label><select id="s-g"><option value="">None</option>'+S.groups.map(function(g){return '<option value="'+g.id+'">'+esc(g.name)+'</option>'}).join('')+'</select></div></div></div><div class="foot"><button class="btn ghost" onclick="delInbox(\''+id+'\')">Throw it away</button><span class="l"></span><button class="btn" onclick="closeOv()">Later</button><button class="btn p" onclick="doSort(\''+id+'\')">Put it there</button></div>')}
function doSort(id){var u=S.inbox.find(function(x){return x.id===id});var k=document.getElementById('s-kind').value,pid=document.getElementById('s-p').value,gid=document.getElementById('s-g').value;var p=pid?Pr(pid):null;
  if((k==='todo'||k==='bug')&&p){p.items.unshift({id:uid(),text:u.text,done:false,tag:k==='bug'?'bug':''});p.lastAct=NOW}else if(k==='link'||k==='note'){S.library.unshift({id:uid(),kind:k,title:u.text,meta:'',group:gid||(p?p.group:'')})}else{S.ideas.unshift({id:uid(),text:u.text,desc:'',at:u.at,opened:null,group:gid||''})}
  S.inbox=S.inbox.filter(function(x){return x.id!==id});closeOv();toast('Done');render()}
function delInbox(id){S.inbox=S.inbox.filter(function(x){return x.id!==id});closeOv();render();toast('Thrown away')}
function openSortLib(id){var x=S.library.find(function(y){return y.id===id});dlg('<div class="dh2"><h3>Which group?</h3><span class="x" onclick="closeOv()">✕</span></div><div class="body"><div style="font-weight:500;margin-bottom:8px">'+esc(x.title)+'</div><label>Group</label><select id="sl-g"><option value="">None</option>'+S.groups.map(function(g){return '<option value="'+g.id+'" '+(x.group===g.id?'selected':'')+'>'+esc(g.name)+'</option>'}).join('')+'</select></div><div class="foot"><button class="btn danger ghost" onclick="S.library=S.library.filter(function(y){return y.id!==\''+id+'\'});closeOv();render()">Delete</button><button class="btn p" onclick="S.library.find(function(y){return y.id===\''+id+'\'}).group=document.getElementById(\'sl-g\').value;closeOv();render();toast(\'Moved\')">Save</button></div>')}
/* ideas */
function openIdea(id){var x=S.ideas.find(function(y){return y.id===id});x.opened=NOW;dlg('<div class="dh2"><h3>Idea</h3><span class="x" onclick="closeOv()">✕</span></div><div class="body"><label>What is it?</label><input type="text" id="id-t" value="'+esc(x.text)+'"><label>Notes</label><textarea id="id-d" rows="4">'+esc(x.desc)+'</textarea><label>Group</label><select id="id-g"><option value="">None yet</option>'+S.groups.map(function(g){return '<option value="'+g.id+'" '+(x.group===g.id?'selected':'')+'>'+esc(g.name)+'</option>'}).join('')+'</select><div class="helper">Written '+ago(x.at)+' ago</div></div><div class="foot"><button class="btn danger ghost" onclick="delIdea(\''+id+'\')">Delete</button><span class="l"></span><button class="btn" onclick="saveIdea(\''+id+'\')">Save</button><button class="btn p" onclick="saveIdea(\''+id+'\',true);startIdea(\''+id+'\')">Start as a project</button></div>')}
function saveIdea(id,q){var x=S.ideas.find(function(y){return y.id===id});x.text=document.getElementById('id-t').value;x.desc=document.getElementById('id-d').value;x.group=document.getElementById('id-g').value;if(!q){closeOv();render();toast('Saved')}}

/* new project */
function openNew(gid,from){dlg('<div class="dh2"><h3>'+(from?'Start this idea as a project':'New project')+'</h3><span class="x" onclick="closeOv()">✕</span></div><div class="body"><label>Name</label><input type="text" id="np-n" value="'+esc(from?from.text:'')+'" placeholder="What is it called?"><div class="row2"><div><label>Group</label><select id="np-g">'+S.groups.map(function(g){return '<option value="'+g.id+'" '+(gid===g.id?'selected':'')+'>'+esc(g.name)+'</option>'}).join('')+'</select></div><div><label>Type</label><select id="np-t">'+S.types.map(function(t){return '<option value="'+t.id+'">'+esc(t.name)+' · '+t.stages.join(' → ')+'</option>'}).join('')+'</select></div></div><div class="row2"><div><label>First next step</label><input type="text" id="np-x" placeholder="The first thing that moves it forward"></div><div><label>On the roadmap</label><select id="np-w">'+HZ.map(function(h){return '<option value="'+h[0]+'" '+(h[0]==='next'?'selected':'')+'>'+h[1]+'</option>'}).join('')+'</select></div></div><div class="helper">It starts at the first stage of its type. Its group decides whether it can be shared.</div></div><div class="foot"><button class="btn" onclick="closeOv()">Cancel</button><button class="btn p" onclick="createP('+(from?"'"+from.id+"'":'null')+')">Create</button></div>')}
function createP(fromId){var n=document.getElementById('np-n').value.trim();if(!n)return;var gid=document.getElementById('np-g').value,tid=document.getElementById('np-t').value;var np={id:uid(),name:n,group:gid,type:tid,stage:0,enteredAt:NOW,when:document.getElementById('np-w').value,next:document.getElementById('np-x').value,items:[],decisions:[],files:[],links:[],notes:'',pub:!G(gid).priv,wait:null,lastAct:NOW,releases:[],people:[],hist:[],quiet:false,origin:null,parked:false,waitHist:[]};if(fromId){var x=S.ideas.find(function(y){return y.id===fromId});np.origin=x.text;np.notes=x.desc;S.ideas=S.ideas.filter(function(y){return y.id!==fromId});if(S.resurfId===fromId)pickResurf()}S.projects.unshift(np);log(np,n+' started','move');closeOv();S.ptab='work';openP(np.id);toast('<b>'+esc(n)+'</b> is a project now')}
/* stages */
function openAdvance(id){var p=Pr(id),ns=nextStage(p),un=unmet(p);dlg('<div class="dh2"><h3>Move '+esc(p.name)+' to '+esc(ns)+'</h3><span class="x" onclick="closeOv()">✕</span></div><div class="body"><div style="color:var(--ink-2)">You\'ve been in <b>'+esc(stageName(p))+'</b> for '+days(p.enteredAt)+' days.</div>'+(un.length?'<div class="warn">A few things from this stage\'s checklist aren\'t done yet:<ul>'+un.map(function(e){return '<li>'+esc(e)+'</li>'}).join('')+'</ul></div>':'<div class="ok">Everything on this stage\'s checklist is done. Nice.</div>')+'<label>Next step in '+esc(ns)+'</label><input type="text" id="adv-x" placeholder="Optional, but it helps tomorrow-you"></div><div class="foot"><button class="btn" onclick="closeOv()">Not yet</button><button class="btn p" onclick="doAdvance(\''+id+'\')">'+(un.length?'Move anyway':'Move to '+esc(ns))+'</button></div>')}
function doAdvance(id){var p=Pr(id);p.hist.push({stage:stageName(p),from:p.enteredAt,to:NOW});p.stage++;p.enteredAt=NOW;var nx=document.getElementById('adv-x').value;p.next=nx||'';var shipped=/release|ship|close|done/i.test(stageName(p));log(p,p.name+' moved to '+stageName(p),shipped?'ship':'move');if(isLast(p)){p.quiet=true;p.when='done'}closeOv();render();toast('<b>'+esc(p.name)+'</b> is now in '+esc(stageName(p))+'.',"undoAdvance('"+id+"')")}
function undoAdvance(id){var p=Pr(id);if(p.stage>0){p.stage--;var h=p.hist.pop();p.enteredAt=h?h.from:d(1);p.quiet=false;S.activity.shift();render();toast('Put back')}}
function jumpStage(id,i){var p=Pr(id);if(i===p.stage)return;if(i===p.stage+1){openAdvance(id);return}if(i>p.stage)p.hist.push({stage:stageName(p),from:p.enteredAt,to:NOW});p.stage=i;p.enteredAt=NOW;p.quiet=isLast(p);log(p,p.name+' set to '+stageName(p),'move');render();toast('Now in '+esc(stageName(p)))}
/* waiting */
function openWait(id){var p=Pr(id);dlg('<div class="dh2"><h3>What is '+esc(p.name)+' waiting on?</h3><span class="x" onclick="closeOv()">✕</span></div><div class="body"><label>Waiting on</label><input type="text" id="w-what" placeholder="A person, a review, a delivery, an answer…"><div class="helper">Dig shows it on Home and counts the days. Nothing will nag you.</div></div><div class="foot"><button class="btn" onclick="closeOv()">Cancel</button><button class="btn p" onclick="setWait(\''+id+'\')">Mark as waiting</button></div>')}
function setWait(id){var w=document.getElementById('w-what').value.trim();if(!w)return;var p=Pr(id);p.wait={what:w,since:NOW};p.lastAct=NOW;closeOv();render();toast('Waiting on '+esc(w))}
function resolveWait(id){var p=Pr(id);if(!p.wait)return;var fin=function(){p.waitHist.unshift({what:p.wait.what,days:days(p.wait.since)});var w=p.wait.what;p.wait=null;p.lastAct=NOW;render();toast('Great, that came through: '+esc(w))};leave('wrow-'+id,fin)}
/* items */
function toggleItem(pid,iid){var p=Pr(pid),x=p.items.find(function(y){return y.id===iid});x.done=!x.done;p.lastAct=NOW;render()}
function delItem(pid,iid){var p=Pr(pid);var x=p.items.find(function(y){return y.id===iid});p.items=p.items.filter(function(y){return y.id!==iid});render();toast('Removed',"Pr('"+pid+"').items.unshift("+JSON.stringify(x).replace(/"/g,'&quot;')+");render()")}
function addItem(pid,text){text=text.trim();if(!text)return;var p=Pr(pid);var bug=text.startsWith('!');p.items.unshift({id:uid(),text:text.replace(/^!\s*/,''),done:false,tag:bug?'bug':''});p.lastAct=NOW;render();setTimeout(function(){var i=document.querySelector('.check.add input');if(i)i.focus()},0)}
function addExpected(pid,text){var p=Pr(pid);p.items.unshift({id:uid(),text:text,done:false,tag:'exp'});render()}
/* decisions */
function openDec(id){var p=Pr(id);dlg('<div class="dh2"><h3>Record a decision · '+dno(nextDecNo())+'</h3><span class="x" onclick="closeOv()">✕</span></div><div class="body"><label>What did you decide, and why?</label><textarea id="dc-t" rows="4" placeholder="Write it so future you understands the reasoning."></textarea><label>Does this replace an earlier decision?</label><select id="dc-s"><option value="">No</option>'+p.decisions.filter(function(x){return !x.superseded}).map(function(x){return '<option value="'+x.no+'">'+dno(x.no)+' · '+esc(x.text.slice(0,50))+'</option>'}).join('')+'</select><div class="helper">Decisions get a number and a date and stay on record. Replaced ones stay visible, crossed out.</div></div><div class="foot"><button class="btn" onclick="closeOv()">Cancel</button><button class="btn p" onclick="recordDecision(\''+id+'\',document.getElementById(\'dc-t\').value,document.getElementById(\'dc-s\').value);closeOv();render()">Record it</button></div>')}
function recordDecision(pid,text,sup){text=(text||'').trim();if(!text)return;var p=Pr(pid);var no=nextDecNo();var s=sup?parseInt(sup,10):null;if(s){var old=p.decisions.find(function(x){return x.no===s});if(old)old.superseded=true}p.decisions.push({no:no,text:text,at:NOW,supersedes:s,superseded:false});log(p,p.name+': '+dno(no)+' recorded','decision');toast(dno(no)+' recorded')}
/* links, files, people, releases */
function addLink(id){dlg('<div class="dh2"><h3>Add a link</h3><span class="x" onclick="closeOv()">✕</span></div><div class="body"><label>Address or name</label><input type="text" id="lk" placeholder="github.com/… or Google Play"></div><div class="foot"><button class="btn" onclick="closeOv()">Cancel</button><button class="btn p" onclick="var t=document.getElementById(\'lk\').value.trim();if(t){Pr(\''+id+'\').links.push(t)};closeOv();render()">Add</button></div>')}
function addFile(id){dlg('<div class="dh2"><h3>Add a file</h3><span class="x" onclick="closeOv()">✕</span></div><div class="body"><div class="helper" style="margin:0 0 6px">In the real app this opens a file picker and keeps a copy inside Dig. Here, just name one.</div><label>Name</label><input type="text" id="fn" placeholder="Technical Specification"><div class="row2"><div><label>Type</label><select id="ft"><option>PDF</option><option>MD</option><option>PNG</option><option>SVG</option><option>ZIP</option><option>HTML</option></select></div><div><label>Version or note</label><input type="text" id="fm" placeholder="v1.0"></div></div></div><div class="foot"><button class="btn" onclick="closeOv()">Cancel</button><button class="btn p" onclick="var n=document.getElementById(\'fn\').value.trim();if(n){Pr(\''+id+'\').files.unshift({type:document.getElementById(\'ft\').value,name:n,meta:document.getElementById(\'fm\').value||\'today\'})};closeOv();render()">Add</button></div>')}
function addPerson(id){dlg('<div class="dh2"><h3>Add a person</h3><span class="x" onclick="closeOv()">✕</span></div><div class="body"><div class="row2"><div><label>Name</label><input type="text" id="pn" placeholder="Who"></div><div><label>Role</label><input type="text" id="pr" placeholder="reviewer, client, collaborator"></div></div><div class="helper">Just a name and a role. Dig is not a contact list.</div></div><div class="foot"><button class="btn" onclick="closeOv()">Cancel</button><button class="btn p" onclick="var n=document.getElementById(\'pn\').value.trim();if(n){Pr(\''+id+'\').people.push({n:n,r:document.getElementById(\'pr\').value})};closeOv();render()">Add</button></div>')}
function addRelease(id){dlg('<div class="dh2"><h3>Record a release</h3><span class="x" onclick="closeOv()">✕</span></div><div class="body"><div class="row2"><div><label>Version</label><input type="text" id="rv" placeholder="1.2.0"></div><div><label>What\'s in it</label><input type="text" id="rn" placeholder="One line"></div></div><div class="helper">Dated today. Shows up on the project\'s roadmap and in Your week.</div></div><div class="foot"><button class="btn" onclick="closeOv()">Cancel</button><button class="btn p" onclick="doRelease(\''+id+'\')">Record</button></div>')}
function doRelease(id){var v=document.getElementById('rv').value.trim();if(!v)return;var p=Pr(id);p.releases.push({v:v,at:NOW,note:document.getElementById('rn').value});log(p,p.name+' '+v+' released','ship');closeOv();render();toast('<b>'+esc(p.name)+' '+esc(v)+'</b> is on the record')}
/* share */
function openShare(id){var p=id&&id!=='rm'?Pr(id):null;var pubP=S.projects.filter(function(y){return y.pub&&!G(y.group).priv});var isRm=id==='rm';dlg('<div class="dh2"><h3>'+(p?'Share '+esc(p.name):(isRm?'Share the roadmap':'Share your projects'))+'</h3><span class="x" onclick="closeOv()">✕</span></div><div class="body"><div class="share-prev">'+(p?'<div class="h">'+esc(p.name)+'</div><div class="s">'+esc(T(p.type).name)+' · '+esc(G(p.group).name)+' · '+esc(stageName(p))+'</div><div class="row3"><div><b>'+(p.stage+1)+' of '+T(p.type).stages.length+'</b><small>stages</small></div><div><b>'+p.items.filter(function(x){return x.done}).length+'</b><small>done</small></div><div><b>'+p.releases.length+'</b><small>releases</small></div></div><div style="color:var(--ink-2)">'+(esc(p.notes)||'No notes yet.')+'</div>':'<div class="h">'+esc(S.org)+(isRm?' · Roadmap':'')+'</div><div class="s">'+pubP.length+' shareable projects · '+S.groups.filter(function(g){return g.priv}).length+' private groups left out</div><div class="row3">'+(isRm?HZ.slice(0,3).map(function(h){return '<div><b>'+pubP.filter(function(y){return (y.when||'later')===h[0]}).length+'</b><small>'+h[1]+'</small></div>'}).join(''):'<div><b>'+S.projects.filter(function(y){return !y.quiet&&!y.parked}).length+'</b><small>active</small></div><div><b>'+S.activity.filter(function(a){return a.kind==='ship'&&days(a.at)<=90}).length+'</b><small>shipped this quarter</small></div><div><b>'+S.projects.reduce(function(s,y){return s+y.decisions.length},0)+'</b><small>decisions on record</small></div>')+'</div><div style="color:var(--ink-2)">Private groups never appear here. The page says so at the bottom.</div>')+'</div></div><div class="foot"><span class="l">Saves a PDF or an image, made on this computer.</span><button class="btn" onclick="closeOv()">Close</button><button class="btn p" onclick="closeOv();toast(\'In the real app this saves the file.\')">Save</button></div>')}
/* settings */
function addGroup(){S.groups.push({id:uid(),name:'New group',color:'#D14A7A',priv:false});render()}
function delGroup(id){if(S.projects.some(function(p){return p.group===id})){toast('Move its projects to another group first');return}S.groups=S.groups.filter(function(g){return g.id!==id});render()}
function addType(){S.types.push({id:uid(),name:'New type',stages:['Start','Middle','Done'],check:{}});render()}
function delType(id){if(S.projects.some(function(p){return p.type===id})){toast('Some projects use this type');return}S.types=S.types.filter(function(t){return t.id!==id});render()}
function renameStage(tid,i,val){var t=T(tid);var old=t.stages[i];t.stages[i]=val;if(t.check[old]){t.check[val]=t.check[old];delete t.check[old]}render()}
function delStage(tid,i){var t=T(tid);if(t.stages.length<=2){toast('A type needs at least two stages');return}var n=t.stages[i];t.stages.splice(i,1);delete t.check[n];S.projects.forEach(function(p){if(p.type===tid&&p.stage>=t.stages.length)p.stage=t.stages.length-1});render()}
function addStage(tid){T(tid).stages.push('New stage');render()}
function addExp(tid,st,val){val=val.trim();if(!val)return;var t=T(tid);(t.check[st]=t.check[st]||[]).push(val);render()}
function delExp(tid,st,i){T(tid).check[st].splice(i,1);render()}

/* ======================= GRID ======================= */
function renderGrid(){
  var views=[['setup','00 · Welcome and setup'],['home','01 · Home'],['projects','02 · Projects'],['roadmap','03 · Roadmap, all groups'],['project','04 · A project · Work'],['project-rm','05 · A project · Roadmap'],['project-rec','06 · A project · Record'],['week','07 · Your week'],['ideas','08 · Ideas'],['library','09 · Library'],['settings','10 · Settings']];
  var kv=S.view,kp=S.projectId,kt=S.ptab,kg=S.filterGroup;S.projectId=S.projectId||'wr';
  var cells=views.map(function(v){var id=v[0];S.ptab=id==='project-rm'?'rm':(id==='project-rec'?'rec':'work');S.view=id.split('-')[0];S.filterGroup='all';return '<div class="gcell"><div class="gl"><b>'+v[1]+'</b><span>1280 × 840</span></div><div class="gframe"><div class="app-inner">'+renderSide()+'<main class="main">'+renderView(S.view)+'</main></div></div></div>'}).join('');
  S.view=kv;S.projectId=kp;S.ptab=kt;S.filterGroup=kg;
  var ov=[['Add something','<div class="dlg" style="margin:90px auto 0"><input class="cap-in" value="Old gallery page still 404s" readonly><div class="types"><span class="ty auto on">Let Dig guess</span><span class="ty">Idea</span><span class="ty">To-do</span><span class="ty">Bug</span><span class="ty">Note</span><span class="ty">Link</span><span class="ty">Decision</span></div><div class="cap-row"><span>Put it in</span><select><option>Website refresh</option></select><span style="color:var(--ink-3)">Saving as a bug (guessed) → Website refresh</span><span class="hint"><kbd>↵</kbd> save</span></div></div>'],['Move to the next stage','<div class="dlg" style="margin:90px auto 0"><div class="dh2"><h3>Move Website refresh to Advance</h3><span class="x">✕</span></div><div class="body"><div style="color:var(--ink-2)">You\'ve been in <b>Align</b> for 6 days.</div><div class="warn">A few things from this stage\'s checklist aren\'t done yet:<ul><li>Plan agreed with client</li></ul></div><label>Next step in Advance</label><input type="text" placeholder="Optional, but it helps tomorrow-you"></div><div class="foot"><button class="btn">Not yet</button><button class="btn p">Move anyway</button></div></div>'],['Record a decision','<div class="dlg" style="margin:90px auto 0"><div class="dh2"><h3>Record a decision · D-0003</h3><span class="x">✕</span></div><div class="body"><label>What did you decide, and why?</label><textarea rows="4">Publish the new pages in one batch, not page by page.</textarea><label>Does this replace an earlier decision?</label><select><option>No</option></select></div><div class="foot"><button class="btn">Cancel</button><button class="btn p">Record it</button></div></div>']];
  var oc=ov.map(function(o){return '<div class="gcell"><div class="gl"><b>Dialog · '+o[0]+'</b></div><div class="gframe"><div class="app-inner" style="display:block;background:rgba(6,10,18,.38)">'+o[1]+'</div></div></div>'}).join('');
  setTimeout(function(){document.querySelectorAll('.gframe').forEach(function(g){var s=g.clientWidth/1280;var inner=g.querySelector('.app-inner');if(inner)inner.style.transform='scale('+s+')'})},0);
  return '<div class="grid-wrap">'+cells+oc+'</div>';
}

/* ======================= KEYS ======================= */
document.addEventListener('keydown',function(e){
  var typing=['INPUT','TEXTAREA','SELECT'].indexOf(document.activeElement.tagName)>=0||document.activeElement.isContentEditable;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCap();return}
  if(e.key==='Escape'){closeOv();return}
  if(typing)return;
  if(e.key==='/'){e.preventDefault();openPal();return}
  if(e.key==='?'){openKeys();return}
  var m={'1':'home','2':'projects','3':'roadmap','4':'ideas','5':'library','6':'week'};if(m[e.key]&&S.mode==='app')go(m[e.key]);
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(S.theme==='system')render()});
window.addEventListener('resize',function(){if(S.mode==='grid')render()});
seed();render();
</script>
</body>
</html>
